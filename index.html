<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinted Monitor Config</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #222); padding: 20px; }
        .container { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; font-size: 14px; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; background: var(--tg-theme-secondary-bg-color, #f0f0f0); color: var(--tg-theme-text-color); }
        button { padding: 15px; background-color: var(--tg-theme-button-color, #0088cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        p { font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛍️ Vinted Monitor</h2>
        <p>Configura una ricerca per ricevere notifiche istantanee.</p>
        
        <label for="name">Nome Ricerca</label>
        <input type="text" id="name" placeholder="Esempio: Jordan 4 Red">
        
        <label for="url">URL Vinted (con filtri applicati)</label>
        <input type="text" id="url" placeholder="https://www.vinted.it/catalog?search_text=...">
        
        <button id="main-button">ATTIVA MONITORAGGIO</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const btn = document.getElementById('main-button');
        
        btn.onclick = function() {
            const name = document.getElementById('name').value;
            const url = document.getElementById('url').value;

            if (!name || !url) {
                tg.showAlert("Per favore, compila entrambi i campi!");
                return;
            }

            if (!url.includes("vinted")) {
                tg.showAlert("L'URL deve essere un link valido di Vinted!");
                return;
            }

            const data = {
                name: name,
                url: url
            };

            // Invia i dati al bot
            tg.sendData(JSON.stringify(data));
        };
    </script>
</body>
</html>
