<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f9; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #0088cc; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h3>➕ Nuovo Monitor</h3>
        <input type="text" id="name" placeholder="Nome ricerca (es. Jordan 4)">
        <input type="text" id="url" placeholder="URL Vinted filtrato">
        <button onclick="send()">ATTIVA</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function send() {
            const name = document.getElementById('name').value;
            const url = document.getElementById('url').value;
            if(!name || !url) return alert("Riempi i campi");

            const payload = JSON.stringify({ action: 'add', name, url });
            tg.sendData(payload); // Invia e chiude l'app
        }
    </script>
</body>
</html>
