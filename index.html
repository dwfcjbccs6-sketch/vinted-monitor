<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>➕ Nuovo Monitor</h2>
    <input type="text" id="name" placeholder="Nome ricerca" style="width:100%; padding:10px; margin-bottom:10px;">
    <input type="text" id="url" placeholder="URL Vinted" style="width:100%; padding:10px; margin-bottom:10px;">
    <button onclick="invia()" style="width:100%; padding:15px; background:#0088cc; color:white; border:none; border-radius:8px;">ATTIVA</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function invia() {
            const n = document.getElementById('name').value;
            const u = document.getElementById('url').value;
            
            if(!n || !u) return alert("Inserisci dati");

            const payload = JSON.stringify({ action: 'add', name: n, url: u });
            
            // LOG PER TE: Se vedi questo alert, l'app sta funzionando
            console.log("Invio dati:", payload);
            
            tg.sendData(payload);
            tg.close();
        }
    </script>
</body>
</html>
