<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; }
        h2 { color: #0088cc; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #0088cc; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>➕ Aggiungi Link</h2>
        <input type="text" id="name" placeholder="Nome (es. Jordan 1)">
        <input type="text" id="url" placeholder="Incolla URL Vinted filtrato">
        <button onclick="send()">AVVIA MONITOR</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        function send() {
            const name = document.getElementById('name').value;
            const url = document.getElementById('url').value;
            if(!name || !url) return alert("Compila tutti i campi!");
            tg.sendData(JSON.stringify({ action: 'add', name, url }));
            tg.close();
        }
    </script>
</body>
</html>
